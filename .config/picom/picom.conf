# picom config, equivalent to ~/.config/compton/compton.conf but using
# picom's modern backend. Point i3's exec_always at this once picom is
# installed (see comment above the compositor line in ~/.config/i3/config).

backend = "glx";

# Shadow - disabled: a drop shadow on a near-black ground reads as mud
shadow = false;

# Fading
fading = true;
fade-delta = 5;
fade-in-step = 0.03;
fade-out-step = 0.04;

# Rounded corners - a small radius; compton (chjj build) doesn't support
# this, which is the one thing picom buys you visually here.
corner-radius = 4;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Tear-free rendering
vsync = true;

# No opacity-rule / active-opacity / inactive-opacity: window transparency
# would let the contour map show through window contents and destroy
# legibility - windows stay fully opaque plates.

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 1.0; focus = true; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 1.0; };
  dropdown_menu = { opacity = 1.0; };
};
